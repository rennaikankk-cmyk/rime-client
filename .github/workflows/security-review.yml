name: Security Review

on:
  push:
    branches: [main, codex/minecraft-1.21.1]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: security-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secure-build:
    name: Secure Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build --no-daemon

  dependency-review:
    name: Dependency Review (PR)
    # Private repositories must opt in after enabling GitHub dependency review.
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.ENABLE_DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL Analysis
    # An Actions variable does not activate GitHub Code Security by itself.
    if: github.event.repository.private == false || vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build for CodeQL
        run: ./gradlew clean build --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  security-summary:
    name: Security Coverage
    if: always()
    needs: [secure-build, dependency-review, codeql, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report results and enforce required checks
        env:
          BUILD_RESULT: ${{ needs.secure-build.result }}
          SECRET_RESULT: ${{ needs.secret-scan.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          CODEQL_OPT_IN: ${{ vars.ENABLE_CODEQL }}
          DEPENDENCY_OPT_IN: ${{ vars.ENABLE_DEPENDENCY_REVIEW }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Security coverage"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Wrapper validation and clean build | $BUILD_RESULT |"
            echo "| Gitleaks secret scan | $SECRET_RESULT |"
            echo "| CodeQL | $CODEQL_RESULT |"
            echo "| Dependency review | $DEPENDENCY_RESULT |"
            echo ""
            if [[ "$REPOSITORY_PRIVATE" == "true" && "$CODEQL_OPT_IN" != "true" ]]; then
              echo "CodeQL was not run: private repository without ENABLE_CODEQL=true."
              echo "Enable GitHub code scanning before setting this Actions variable."
            fi
            if [[ "$EVENT_NAME" != "pull_request" ]]; then
              echo "Dependency review only runs on pull requests."
            elif [[ "$REPOSITORY_PRIVATE" == "true" && "$DEPENDENCY_OPT_IN" != "true" ]]; then
              echo "Dependency review was not run: private repository without ENABLE_DEPENDENCY_REVIEW=true."
              echo "Enable GitHub dependency review before setting this Actions variable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$BUILD_RESULT" == "success" && "$SECRET_RESULT" == "success" ]] || exit 1
          if [[ "$REPOSITORY_PRIVATE" == "false" || "$CODEQL_OPT_IN" == "true" ]]; then
            [[ "$CODEQL_RESULT" == "success" ]] || exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" && ( "$REPOSITORY_PRIVATE" == "false" || "$DEPENDENCY_OPT_IN" == "true" ) ]]; then
            [[ "$DEPENDENCY_RESULT" == "success" ]] || exit 1
          fi
