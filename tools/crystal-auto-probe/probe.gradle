allprojects {
 afterEvaluate {
  if (!plugins.hasPlugin('fabric-loom')) return
  def lab = project.file('../crystal-auto-lab')
  sourceSets.create('crystalAutoProbe') {
   java.srcDir('tools/crystal-auto-probe/src')
   resources.srcDir('tools/crystal-auto-probe/resources')
   compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
   runtimeClasspath += output + compileClasspath
  }
  tasks.register('crystalAutoProbeJar', Jar) {
   dependsOn tasks.named('crystalAutoProbeClasses')
   from sourceSets.crystalAutoProbe.output
   archiveFileName = 'crystal-auto-probe.jar'
   destinationDirectory = lab
  }
  loom.runs.client {
   runDir('../crystal-auto-lab/' + (project.findProperty('probeRun') ?: 'baseline'))
   programArgs('--quickPlaySingleplayer','ProbeWorld','--username','CrystalAuto','--width','854','--height','480')
   vmArg('-Dfabric.addMods=' + new File(lab,'crystal-auto-probe.jar').path)
   if (project.findProperty('expectCrystals') == 'true') vmArg('-Dcrystal.expect=true')
   if (project.findProperty('extended') == 'true') vmArg('-Dcrystal.extended=true')
   if (project.hasProperty('probeStart')) vmArg('-Dcrystal.start=' + project.property('probeStart'))
   if (project.hasProperty('probeEnd')) vmArg('-Dcrystal.end=' + project.property('probeEnd'))
  }
 }
}
