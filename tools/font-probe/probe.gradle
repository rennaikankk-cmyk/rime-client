allprojects {
 afterEvaluate {
  if (!plugins.hasPlugin('fabric-loom')) return
  def probe = project.file('tools/font-probe')
  def lab = project.file('../font-audit')
  sourceSets.create('fontProbe') {
   java.srcDir(new File(probe, 'src'))
   resources.srcDir(new File(probe, 'resources'))
   compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
   runtimeClasspath += output + compileClasspath
  }
  tasks.register('fontProbeJar', Jar) {
   dependsOn tasks.named('fontProbeClasses')
   from sourceSets.fontProbe.output
   archiveFileName = 'font-probe.jar'
   destinationDirectory = lab
  }
  loom.runs.client {
   runDir('../font-audit/' + (project.findProperty('probeRun') ?: 'render01'))
   programArgs('--quickPlaySingleplayer', 'ProbeWorld', '--username', 'FontProbe', '--width', '1280', '--height', '900')
   vmArg('-Dfabric.addMods=' + new File(lab, 'font-probe.jar').path)
  }
  tasks.named('runClient') { dependsOn tasks.named('fontProbeClasses') }
 }
}
