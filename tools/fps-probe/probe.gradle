allprojects {
 afterEvaluate {
  if (!plugins.hasPlugin('fabric-loom')) return
  def probe = project.file('tools/fps-probe')
  def lab = project.file('../fps-1211-lab')
  sourceSets.create('fpsProbe') {
   java.srcDir(new File(probe, 'src'))
   resources.srcDir(new File(probe, 'resources'))
   compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
   runtimeClasspath += output + compileClasspath
  }
  tasks.register('fpsProbeJar', Jar) {
   dependsOn tasks.named('fpsProbeClasses')
   from sourceSets.fpsProbe.output
   archiveFileName = 'fps-probe.jar'
   destinationDirectory = lab
  }
  loom.runs.client {
   runDir('../fps-1211-lab/' + (project.findProperty('probeRun') ?: 'baseline'))
   programArgs('--quickPlaySingleplayer','ProbeWorld','--username','FpsProbe','--width','854','--height','480')
   vmArg('-Dfabric.addMods=' + new File(lab,'fps-probe.jar').path)
  }
 }
}
