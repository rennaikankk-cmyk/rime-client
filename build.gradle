clientRegressionTests.each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs ${taskName} regression checks."
        dependsOn flightTestClasses
        classpath = sourceSets.flightTest.runtimeClasspath
        mainClass = entryPoint
        systemProperty 'java.awt.headless', 'true'
        // Preserve compatibility with the parallel source tree's optional test entries.
        onlyIf { sourceSets.flightTest.allJava.srcDirs.any { d -> new File(d, entryPoint.replace('.', '/') + '.java').exists() } }
    }
}

tasks.named('check') {
    dependsOn elytraPhysicsTest, elytraHookTest
    dependsOn clientRegressionTests.keySet()
}

sourcesJar {
    dependsOn(generateBuildConfig)
}

jar {
    from("LICENSE") {
        rename { "${it}_${archives_base_name}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn(generateBuildConfig)
}

def execute(String cmd) {
    var output = providers.exec {
        commandLine cmd.split(" ")
        ignoreExitValue = true
    }
    return output.standardOutput.getAsText().getOrElse("nogit")
            .replaceAll("\n", "");
}


// ------------------------------------------------------------ obfuscation
// ProGuard rename pass over the remapped jar: mixin classes, the entrypoint,
// the settings system and event annotations stay; everything else is renamed.

def obfuscationInput = layout.buildDirectory.file('proguard-in.jar')
def obfuscationOutput = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}-obfuscated.jar")
def obfuscationMapping = layout.buildDirectory.file('proguard-map.txt')

tasks.register('prepareObfuscationInput') {
    dependsOn remapJar
    inputs.file(remapJar.archiveFile)
    outputs.file(obfuscationInput)
    doLast {
        java.nio.file.Files.copy(remapJar.archiveFile.get().asFile.toPath(),
                obfuscationInput.get().asFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.register('obfuscateJar', proguard.gradle.ProGuardTask) {
    dependsOn prepareObfuscationInput, check
    // resolve external fabric classes: without these ProGuard strips the
    // 'implements ModInitializer' table from kept classes (ClassCastException at entrypoint)
    def apiJar = new File(projectDir, ".gradle/loom-cache/remapped_mods/remapped/net/fabricmc/fabric-api/fabric-api-4abd26ae/0.141.1+1.21.11/fabric-api-4abd26ae-0.141.1+1.21.11.jar")
    if (apiJar.exists()) libraryjars files(apiJar)
    libraryjars configurations.compileClasspath.filter { it.name.startsWith('fabric-loader-') }
    // JDK base classes: without this ProGuard strips 'extends java.lang.Enum' from
    // enums (ClassCastException: not an enum) just like it stripped entrypoint interfaces
    libraryjars files("${System.getProperty('java.home')}/jmods/java.base.jmod")
    libraryjars files("${System.getProperty('java.home')}/jmods/java.management.jmod")
    // Preserve the bounded heartbeat subscriber's JDK HTTP interface and callbacks.
    libraryjars files("${System.getProperty('java.home')}/jmods/java.net.http.jmod")
    // Minecraft itself (intermediary names): without it ProGuard cannot see that
    // GuizhouWareGui extends class_437 (Screen), so the render/init/onClose overrides
    // look like unreferenced methods, get renamed, and the ClickGUI renders nothing.
    // Resolve the actual Loom artifact, including custom GRADLE_USER_HOME/CI caches.
    // Missing libraries must fail the build instead of silently stripping GUI overrides.
    libraryjars loom.getMinecraftJarsCollection(net.fabricmc.loom.api.mappings.layered.MappingsNamespace.INTERMEDIARY)
    injars obfuscationInput.get().asFile
    outjars obfuscationOutput.get().asFile
    printmapping obfuscationMapping.get().asFile

    // runtime deps are provided by the loader — silence everything missing
    dontwarn()
    dontoptimize()
    keepattributes '*Annotation*,Signature,InnerClasses,EnclosingMethod,Record,SourceFile,LineNumberTable'

    keep 'class dev.guizhou.GuizhouWare { *; }'
    keep 'class dev.guizhou.mixin.** { *; }'
    keep 'class dev.guizhou.features.settings.** { *; }'
    keep 'class dev.guizhou.event.system.Subscribe { *; }'
    keepclassmembers 'class * { @dev.guizhou.event.system.Subscribe <methods>; }'
    // Class.getEnumConstants, EnumSet and settings resolve these by name at runtime.
    keepclassmembers 'enum * { public static **[] values(); public static ** valueOf(java.lang.String); }'
    // Preserve the deliberate AI_GUARD_NOTICE reference even while status() has no caller.
    // Names may still be obfuscated; only shrinking this protection anchor is forbidden.
    keepclassmembers allowobfuscation: true, 'class dev.guizhou.manager.HeartbeatManager { public java.lang.String status(); }'
    // fabric entrypoints referenced by string in fabric.mod.json
    renamesourcefileattribute 'SourceFile'
    repackageclasses ''
}

tasks.register('verifyObfuscatedJar', JavaExec) {
    group = 'verification'
    description = 'Checks final obfuscated enum reflection, entrypoints, mixins and protection invariants.'
    dependsOn obfuscateJar, flightTestClasses
    classpath = sourceSets.flightTest.runtimeClasspath
    mainClass = 'dev.guizhou.build.ObfuscatedJarTest'
    args obfuscationInput.get().asFile.absolutePath, obfuscationOutput.get().asFile.absolutePath,
            obfuscationMapping.get().asFile.absolutePath
}

tasks.named('build') {
    dependsOn verifyObfuscatedJar
}
